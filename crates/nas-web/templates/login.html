
<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Iniciar Sesión • %%safeHostname%% (Debian 13)</title>
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('nas_theme');
        if (savedTheme) {
          document.documentElement.setAttribute('data-theme', savedTheme);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/app.css?v=%%asset_version%%">
  <style>
    body.login-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: var(--bg-body);
      background-image: radial-gradient(circle at 50% 20%, rgba(0, 102, 204, 0.08) 0%, transparent 60%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text-main);
    }
    .login-container {
      width: 100%;
      max-width: 440px;
      padding: 20px;
      box-sizing: border-box;
    }
    .login-card {
      /* Efecto cursor spotlight + glowing border (antigravity style). */
      --spot-color: rgba(56, 189, 248, 0.10);
      --spot-border: rgba(14, 165, 233, 0.40);
      --spot-active: 0;
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.35);
      overflow: hidden;
    }
    [data-theme="dark"] .login-card {
      --spot-color: rgba(255, 255, 255, 0.08);
      --spot-border: rgba(255, 255, 255, 0.35);
    }
    /* Spotlight interior: halo radial que sigue la posicion exacta del cursor. */
    .login-card::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      background: radial-gradient(circle 240px at var(--mx, 50%) var(--my, 50%), var(--spot-color), transparent 70%);
      opacity: var(--spot-active);
      transition: opacity 350ms ease;
      pointer-events: none;
    }
    /* Glowing border: anillo de 1.5 px cuyo punto brillante sigue al cursor. */
    .login-card::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      border-radius: 6px;
      padding: 1.5px;
      background: radial-gradient(circle 200px at var(--mx, 50%) var(--my, 50%), var(--spot-border), transparent 70%);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask-composite: exclude;
      opacity: var(--spot-active);
      transition: opacity 350ms ease;
      pointer-events: none;
    }
    .login-card > * {
      position: relative;
      z-index: 1;
    }
    @media (prefers-reduced-motion: reduce) {
      .login-card::before,
      .login-card::after {
        transition: none;
      }
    }
    /* Capa de particulas (polvo estelar) que sigue al puntero. */
    .login-card > canvas.login-fx {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .login-header {
      padding: 24px 28px 20px;
      background: var(--bg-card-header);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .login-brand {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Logotipo iintec monocromo: la máscara toma la silueta del SVG y el
       color lo aporta el tema (azul en claro, blanco puro en oscuro).
       Sin soporte de mask se ve a color. */
    .login-brand-logo {
      height: 40px;
      width: 273px;
      flex-shrink: 0;
      background-color: var(--accent-primary);
      -webkit-mask: url("/img/logo-iintec.svg") no-repeat center / contain;
      mask: url("/img/logo-iintec.svg") no-repeat center / contain;
    }
    [data-theme="dark"] .login-brand-logo {
      background-color: #ffffff;
    }
    .login-body {
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .login-alert {
      display: none;
      padding: 10px 14px;
      border-radius: 4px;
      font-size: 13px;
      line-height: 1.4;
      background: rgba(201, 25, 11, 0.15);
      border: 1px solid var(--accent-danger);
      color: #ff857a;
    }
    .login-alert.visible {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
    }
    .input-with-icon {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-with-icon input {
      width: 100%;
      padding: 10px 38px 10px 12px;
      font-size: 14px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background: var(--bg-input);
      color: var(--text-main);
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .input-with-icon input:focus {
      border-color: var(--accent-primary);
    }
    .input-addon-btn {
      position: absolute;
      right: 8px;
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .input-addon-btn:hover {
      color: var(--text-main);
    }
    .login-footer {
      padding: 14px 28px;
      background: var(--bg-card-header);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-muted);
    }
  </style>
</head>
<body class="login-page">

  <!-- Iconos SVG Inline (100% Offline) -->
  <svg style="display:none;">
    <defs>
      <symbol id="icon-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
      <symbol id="icon-eye" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="icon-eye-off" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></symbol>
      <symbol id="icon-alert-triangle" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></symbol>
      <symbol id="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></symbol>
    </defs>
  </svg>

  <div class="login-container">
      <div class="login-card">
        <canvas class="login-fx" aria-hidden="true"></canvas>
        <div class="login-header">
        <div class="login-brand">
          <img class="login-brand-logo" src="/img/logo-iintec.svg?v=%%asset_version%%" alt="iintec" width="273" height="40">
        </div>
      </div>

      <div class="login-body">
        <div id="login-alert" class="login-alert %%error_visible%%">
          <svg class="icon icon-sm" style="flex-shrink:0;"><use href="#icon-alert-triangle"></use></svg>
          <span id="login-alert-text">%%error_text%%</span>
        </div>

        <form id="login-form" method="POST" action="/login">
          <input type="hidden" name="csrf_token" id="csrf_token" value="%%csrf_token%%">
          <div class="form-group" style="margin-bottom:16px;">
            <label for="username">Usuario del sistema:</label>
            <div class="input-with-icon">
              <input type="text" id="username" name="username" required autofocus placeholder="ej. sistemas o administrador" autocomplete="username">
            </div>
          </div>

          <div class="form-group" style="margin-bottom:20px;">
            <label for="password">Contraseña:</label>
            <div class="input-with-icon">
              <input type="password" id="password" name="password" required placeholder="Contraseña de acceso" autocomplete="current-password">
              <button type="button" class="input-addon-btn" id="btn-toggle-pass" title="Mostrar/ocultar contraseña" onclick="togglePassVisibility()">
                <svg class="icon icon-sm" id="icon-pass-toggle"><use href="#icon-eye"></use></svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary" id="btn-submit" style="width:100%; justify-content:center; padding:10px;">
            <svg class="icon"><use href="#icon-lock"></use></svg>
            <span>Iniciar sesión</span>
          </button>
        </form>
      </div>

      <div class="login-footer">
        <span>IP: <strong>%%safeServerIp%%</strong></span>
        <span>Debian 13 (Trixie)</span>
      </div>
    </div>
  </div>

  <script>
    function togglePassVisibility() {
      const pass = document.getElementById('password');
      const icon = document.getElementById('icon-pass-toggle');
      if (pass.type === 'password') {
        pass.type = 'text';
        icon.innerHTML = '<use href="#icon-eye-off"></use>';
      } else {
        pass.type = 'password';
        icon.innerHTML = '<use href="#icon-eye"></use>';
      }
    }

    /* Efecto cursor spotlight + glowing border sobre la tarjeta de acceso. */
    (function() {
      const card = document.querySelector('.login-card');
      if (!card || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      card.addEventListener('pointermove', function(e) {
        const rect = card.getBoundingClientRect();
        card.style.setProperty('--mx', (e.clientX - rect.left) + 'px');
        card.style.setProperty('--my', (e.clientY - rect.top) + 'px');
      }, { passive: true });
      card.addEventListener('pointerenter', function() {
        card.style.setProperty('--spot-active', '1');
      });
      card.addEventListener('pointerleave', function() {
        card.style.setProperty('--spot-active', '0');
      });
    })();

    /* Polvo estelar: particulas que siguen al puntero sobre la tarjeta. */
    (function() {
      const canvas = document.querySelector('.login-fx');
      const cardFx = document.querySelector('.login-card');
      if (!canvas || !cardFx || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const MAX_PARTICLES = 90;
      let particles = [];
      let rafId = null;
      let lastTs = 0;
      let lastX = null;
      let lastY = null;

      function resize() {
        canvas.width = Math.round(cardFx.clientWidth * dpr);
        canvas.height = Math.round(cardFx.clientHeight * dpr);
      }
      resize();
      new ResizeObserver(resize).observe(cardFx);

      function spawn(x, y) {
        const dark = document.documentElement.getAttribute('data-theme') === 'dark';
        const rgb = dark ? '255,255,255' : '56,189,248';
        const n = 1 + (Math.random() < 0.35 ? 1 : 0);
        for (let i = 0; i < n; i++) {
          if (particles.length >= MAX_PARTICLES) particles.shift();
          particles.push({
            x: (x + (Math.random() * 6 - 3)) * dpr,
            y: (y + (Math.random() * 6 - 3)) * dpr,
            vx: (Math.random() * 0.3 - 0.15) * dpr,
            vy: (Math.random() * 0.2 - 0.25) * dpr,
            r: (0.8 + Math.random() * 1.2) * dpr,
            life: 500 + Math.random() * 400,
            age: 0,
            alpha: 0.5 + Math.random() * 0.35,
            rgb: rgb
          });
        }
        if (rafId === null) {
          lastTs = performance.now();
          rafId = requestAnimationFrame(tick);
        }
      }

      function tick(ts) {
        const dt = Math.min(ts - lastTs, 50);
        lastTs = ts;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles = particles.filter(function(p) {
          p.age += dt;
          if (p.age >= p.life) return false;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          const t = p.age / p.life;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r * (1 - t * 0.4), 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(' + p.rgb + ',' + (p.alpha * (1 - t)).toFixed(3) + ')';
          ctx.fill();
          return true;
        });
        if (particles.length > 0) {
          rafId = requestAnimationFrame(tick);
        } else {
          rafId = null;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }

      cardFx.addEventListener('pointermove', function(e) {
        const rect = cardFx.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        /* Umbral por distancia: evita amontonar particulas en movimientos lentos. */
        if (lastX === null || Math.hypot(x - lastX, y - lastY) > 6) {
          lastX = x;
          lastY = y;
          spawn(x, y);
        }
      }, { passive: true });
      cardFx.addEventListener('pointerleave', function() {
        lastX = null;
        lastY = null;
      });
    })();

    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;
      const btn = document.getElementById('btn-submit');
      const alertBox = document.getElementById('login-alert');
      const alertText = document.getElementById('login-alert-text');

      if (!user || !pass) return;

      btn.disabled = true;
      btn.style.opacity = '0.7';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json',
            'X-CSRF-Token': document.getElementById('csrf_token') ? document.getElementById('csrf_token').value : ''
          },
          body: JSON.stringify({ username: user, password: pass })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          window.location.href = '/';
        } else {
          alertText.textContent = data.error || 'Credenciales inválidas. Verifica usuario y contraseña.';
          alertBox.classList.add('visible');
          btn.disabled = false;
          btn.style.opacity = '1';
        }
      } catch (err) {
        // Fallback a envío de formulario estándar si fetch fallara
        document.getElementById('login-form').submit();
      }
    });
  </script>
</body>
</html>
