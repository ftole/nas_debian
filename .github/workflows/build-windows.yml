name: Build Asistente Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Compilar NAS-Assistant.exe
    runs-on: windows-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar entorno Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-assistant.txt pyinstaller flake8 pytest

      - name: Analizar codigo del asistente
        run: python -m flake8 nas_admin.py

      - name: Pruebas unitarias del asistente
        run: python -m pytest tests/test_nas_admin.py -q

      - name: Compilar ejecutable instalable
        run: pyinstaller --clean --noconfirm nas-assistant.spec

      - name: Adjuntar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: NAS-Assistant
          path: dist/NAS-Assistant.exe

      - name: Publicar en Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NAS-Assistant.exe
          generate_release_notes: true