name: Validacion NAS Debian

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint-bash:
    name: Validar Scripts Bash (ShellCheck)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verificar sintaxis Bash (bash -n)
        run: |
          find . -path ./legacy -prune -o -type f -name "*.sh" -print0 | xargs -0 -n1 bash -n
          for f in packaging/nas-*; do
            case "$f" in *.env*|*.service|*.conf) continue ;; esac
            bash -n "$f"
          done

      - name: Verificar invariantes de seguridad
        run: |
          if grep -RIn --exclude-dir=legacy --exclude-dir=tests \
              "StrictHostKeyChecking=no" \
              src packaging install.sh scripts; then
            echo "ERROR: se detectó StrictHostKeyChecking=no en código ejecutable."
            exit 1
          fi

      - name: Ejecutar ShellCheck en los scripts vigentes
        run: |
          find src scripts packaging -type f -name "*.sh" -print0 | xargs -0 shellcheck -x
          for f in packaging/nas-*; do
            case "$f" in *.env*|*.service|*.conf) continue ;; esac
            shellcheck -x "$f"
          done
          shellcheck -x install.sh

  test-bash:
    name: Pruebas del motor Bash (BATS)
    runs-on: ubuntu-latest
    needs: lint-bash
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Instalar BATS
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Ejecutar suite del motor de despliegue
        run: bats tests/

  rust:
    name: Validar Plataforma Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Instalar toolchain estable de Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verificar formato (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Análisis estático estricto (cargo clippy)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Ejecutar suite de pruebas Rust
        run: cargo test --workspace --locked

  lint-js:
    name: Validar Sintaxis del Panel (node --check)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verificar sintaxis del JavaScript empaquetado
        run: |
          find crates/nas-web/assets/js -type f -name "*.js" -print0 | xargs -0 -n1 node --check

  parity:
    name: Contrato de Paridad del Panel
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Verificar contrato, rutas y assets
        run: python3 scripts/parity_extract.py --check

      - name: Auditar la interfaz portada (IDs, manejadores y vistas)
        run: python3 scripts/qa_ui_audit.py --static
