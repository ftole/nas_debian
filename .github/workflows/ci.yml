name: Validacion NAS Debian

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint-bash:
    name: Validar Scripts Bash (ShellCheck)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verificar sintaxis Bash (bash -n)
        run: |
          find . -type f -name "*.sh" -print0 | xargs -0 -n1 bash -n

      - name: Verificar invariantes de seguridad
        run: |
          if grep -RIn --exclude-dir=tests \
              --include="*.py" \
              --include="*.sh" \
              "StrictHostKeyChecking=no" \
              src install.sh; then
            echo "ERROR: se detectó StrictHostKeyChecking=no en código ejecutable."
            exit 1
          fi

      - name: Ejecutar ShellCheck en todos los scripts
        run: |
          # Buscar recursivamente todos los archivos .sh y analizarlos
          find . -type f -name "*.sh" -print0 | xargs -0 shellcheck -x

  test-bash:
    name: Pruebas Unitarias (BATS)
    runs-on: ubuntu-latest
    needs: lint-bash
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        
      - name: Instalar BATS
        run: sudo apt-get update && sudo apt-get install -y bats
        
      - name: Ejecutar Suite de Pruebas Unitarias
        run: bats tests/

  lint-python:
    name: Validar Sintaxis Python (Flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
      - name: Configurar entorno Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          
      - name: Analizar codigo de Cockpit
        run: |
          # Analizamos errores criticos de sintaxis en el backend web de backups
          if [ -f "src/web/backups/backup_api.py" ]; then
            flake8 src/web/backups/backup_api.py --select=E9,F63,F7,F82,E722 --show-source
          fi

  test-python:
    name: Pruebas Unitarias Python (pytest)
    runs-on: ubuntu-latest
    needs: lint-python
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar entorno Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Ejecutar pruebas del backend web
        run: pytest tests/ -q
