name: Validacion NAS Debian

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-bash:
    name: Validar Scripts Bash (ShellCheck)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verificar sintaxis Bash (bash -n)
        run: |
          find src scripts packaging -type f -name "*.sh" -print0 | xargs -0 -n1 bash -n
          bash -n install.sh

      - name: Verificar invariantes de seguridad
        run: |
          if grep -RIn --exclude-dir=legacy --exclude-dir=tests \
              --include="*.py" \
              --include="*.sh" \
              "StrictHostKeyChecking=no" \
              src install.sh scripts; then
            echo "ERROR: se detectó StrictHostKeyChecking=no en código ejecutable."
            exit 1
          fi

      - name: Ejecutar ShellCheck en los scripts vigentes
        run: |
          find src scripts packaging -type f -name "*.sh" -print0 | xargs -0 shellcheck -x
          shellcheck -x install.sh

  test-bash:
    name: Pruebas del Motor Bash (BATS)
    runs-on: ubuntu-latest
    needs: lint-bash
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Instalar BATS
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Deshabilitar tests que requieren el runner real
        run: |
          # Los tests que requieren ejecutar nas o sudo no se ven en CI
          mv -n tests/deploy_shim.bats tests/deploy_shim.bats.skipped || true

      - name: Ejecutar suite del motor de despliegue
        run: |
          set -o pipefail
          if ! bats -t tests/*.bats 2>&1 | tee /tmp/bats.log; then
            echo "### Resumen de fallos en suite BATS" >> "$GITHUB_STEP_SUMMARY"
            echo '```tap' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/bats.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E '^not ok' /tmp/bats.log | while IFS= read -r err_line; do
              echo "::error::$err_line"
            done
            exit 1
          fi

  rust:
    name: Plataforma Rust (fmt, clippy, pruebas, empaquetado y paridad)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Preparar toolchain estable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: Verificar formato
        run: cargo fmt --all --check

      - name: Analizar con Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Ejecutar pruebas
        run: cargo test --workspace --locked

      - name: Compilar en modo release
        run: cargo build --workspace --release --locked

      - name: Validar empaquetado (systemd, nginx, instalador, sudoers)
        run: bash packaging/verify.sh

      - name: Verificar contrato de paridad del panel
        run: python3 scripts/parity_extract.py --check

      - name: Auditar la interfaz portada (IDs, manejadores y vistas)
        run: python3 scripts/qa_ui_audit.py --static

  lint-js:
    name: Validar Sintaxis del Panel (node --check)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verificar sintaxis del JavaScript empaquetado
        run: |
          find crates/nas-web/assets/js -type f -name "*.js" -print0 | xargs -0 -n1 node --check
