name: Validacion NAS Debian

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint-bash:
    name: Validar Scripts Bash (ShellCheck)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verificar sintaxis Bash (bash -n)
        run: |
          find . -type f -name "*.sh" -print0 | xargs -0 -n1 bash -n

      - name: Verificar invariantes de seguridad
        run: |
          if grep -RIn --exclude-dir=tests \
              --include="*.py" \
              --include="*.sh" \
              "StrictHostKeyChecking=no" \
              src install.sh; then
            echo "ERROR: se detectó StrictHostKeyChecking=no en código ejecutable."
            exit 1
          fi

      - name: Ejecutar ShellCheck en todos los scripts
        run: |
          # Buscar recursivamente todos los archivos .sh y analizarlos
          find . -type f -name "*.sh" -print0 | xargs -0 shellcheck -x

  test-bash:
    name: Pruebas Unitarias (BATS)
    runs-on: ubuntu-latest
    needs: lint-bash
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        
      - name: Instalar BATS
        run: sudo apt-get update && sudo apt-get install -y bats
        
      - name: Ejecutar Suite de Pruebas Unitarias
        run: bats tests/

  lint-python:
    name: Validar Sintaxis Python (Flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
      - name: Configurar entorno Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          
      - name: Analizar codigo Python
        run: |
          # Analisis amplio con la configuracion del proyecto (.flake8)
          flake8 tests/

  test-python:
    name: Pruebas Unitarias Python (pytest)
    runs-on: ubuntu-latest
    needs: lint-python
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar entorno Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ejecutar pruebas del frontend/mockup
        run: pytest tests/ -q

  test-php:
    name: Validar Entorno Web PHP 8 (Sintaxis y Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar PHP 8.2
        uses: shivammathur/setup-php@c54fccf54d2b40b8c9733483034a0428581ad839 # v2
        with:
          php-version: "8.2"

      - name: Validar sintaxis PHP (php -l)
        run: |
          find web/ -type f -name "*.php" -print0 | xargs -0 -n1 php -l
          find tests/ -type f -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Ejecutar Suite de Pruebas PHP
        run: php tests/test_web.php
