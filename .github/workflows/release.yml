name: Publicar Release Oficial

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de la release a publicar (ej: v0.1.4)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Compilar, empaquetar y publicar release
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Determinar versión y tag
        id: vars
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG_NAME="${{ inputs.tag }}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG_NAME#v}"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Tag: ${TAG_NAME}, Version: ${VERSION}"

      - name: Instalar toolchain estable de Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compilar binarios en release
        run: cargo build --workspace --release --locked

      - name: Validar empaquetado
        run: bash packaging/verify.sh

      - name: Generar paquete oficial, suma y manifiesto
        run: bash scripts/package.sh "${{ steps.vars.outputs.version }}" dist/out target/release

      - name: Preparar clave Ed25519 y derivar la pública
        env:
          NAS_RELEASE_KEY: ${{ secrets.NAS_RELEASE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NAS_RELEASE_KEY:-}" ]; then
            echo "[-] Falta el secreto NAS_RELEASE_KEY (hex Ed25519 de 32 bytes)" >&2
            exit 1
          fi
          if ! printf '%s' "${NAS_RELEASE_KEY}" | grep -qE '^[0-9a-fA-F]{64}$'; then
            echo "[-] NAS_RELEASE_KEY debe ser hex de 32 bytes (64 caracteres)" >&2
            exit 1
          fi
          printf '%s' "${NAS_RELEASE_KEY}" > /tmp/release.key
          chmod 0600 /tmp/release.key
          cargo run --quiet -p nas-cli -- update pubkey --key /tmp/release.key > /tmp/pubkey.txt
          RELEASE_PUB_HEX=$(tail -1 /tmp/pubkey.txt | tr -d '[:space:]')
          rm -f /tmp/release.key /tmp/pubkey.txt
          if [ -z "${RELEASE_PUB_HEX}" ]; then
            echo "[-] No se pudo derivar la clave pública" >&2
            exit 1
          fi
          echo "${RELEASE_PUB_HEX}" > "dist/out/release.pub"
          echo "${RELEASE_PUB_HEX}" > packaging/release.pub

      - name: Firmar manifiesto con Ed25519 (obligatorio)
        env:
          NAS_RELEASE_KEY: ${{ secrets.NAS_RELEASE_KEY }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.vars.outputs.version }}"
          printf '%s' "${NAS_RELEASE_KEY}" > /tmp/release.key
          chmod 0600 /tmp/release.key
          cargo run --quiet -p nas-cli -- update sign \
            "dist/out/nas-${VERSION}.json" \
            --out "dist/out/nas-${VERSION}.json" \
            --key /tmp/release.key
          rm -f /tmp/release.key
          cargo run --quiet -p nas-cli -- update verify \
            "dist/out/nas-${VERSION}.json" \
            --artifact "dist/out/nas_debian-${VERSION}.tar.gz" \
            --pubkey "$(cat packaging/release.pub)"
          echo "Manifiesto firmado y verificado con Ed25519 (incluye SHA-256 del paquete)."

      - name: Publicar Release en GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.vars.outputs.tag_name }}"
          VERSION="${{ steps.vars.outputs.version }}"
          TITLE="${TAG_NAME} • Servidor NAS & Central de Respaldos Debian 13"
          echo "Artefactos a publicar (incluye manifiesto firmado Ed25519):"
          ls -la dist/out/ || true

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Actualizando release existente ${TAG_NAME}..."
            gh release upload "${TAG_NAME}" dist/out/* --clobber
          else
            echo "Creando nueva release ${TAG_NAME}..."
            gh release create "${TAG_NAME}" \
              --title "${TITLE}" \
              --generate-notes \
              dist/out/*
          fi
