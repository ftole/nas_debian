name: Publicar Release Oficial

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de la release a publicar (ej: v0.1.4)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Compilar, empaquetar y publicar release
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Determinar versión y tag
        id: vars
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG_NAME="${{ inputs.tag }}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG_NAME#v}"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Tag: ${TAG_NAME}, Version: ${VERSION}"

      - name: Instalar toolchain estable de Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compilar binarios en release
        run: cargo build --workspace --release --locked

      - name: Validar empaquetado
        run: bash packaging/verify.sh

      - name: Generar paquete oficial, suma y manifiesto
        run: bash scripts/package.sh "${{ steps.vars.outputs.version }}" dist/out target/release

      - name: Publicar Release en GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.vars.outputs.tag_name }}"
          VERSION="${{ steps.vars.outputs.version }}"
          TITLE="${TAG_NAME} • Servidor NAS & Central de Respaldos Debian 13"

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Actualizando release existente ${TAG_NAME}..."
            gh release upload "${TAG_NAME}" dist/out/* --clobber
          else
            echo "Creando nueva release ${TAG_NAME}..."
            gh release create "${TAG_NAME}" \
              --title "${TITLE}" \
              --generate-notes \
              dist/out/*
          fi
