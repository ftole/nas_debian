<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" style="background:#0f172a; font-family:system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="accent-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Header -->
  <rect x="30" y="24" width="900" height="60" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="65" cy="54" r="14" fill="#06b6d4"/>
  <path d="M60 54 L65 49 L70 54 M65 50 L65 60" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="92" y="48" fill="#f8fafc" font-size="18" font-weight="700">Flujo de Respaldo, Staging Atómico y Deduplicación</text>
  <text x="92" y="68" fill="#94a3b8" font-size="12">Pipeline de copia resiliente ante cortes, apagones y ransomware con deduplicación por Hardlinks (&gt;85%)</text>

  <!-- Paso 1: Orígenes -->
  <g transform="translate(30, 105)">
    <rect width="250" height="395" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="250" height="4" rx="2" fill="#38bdf8"/>
    <text x="18" y="28" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1">1. ORÍGENES DE DATOS</text>

    <!-- Origen Windows -->
    <rect x="15" y="45" width="220" height="95" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="25" y="68" fill="#f8fafc" font-size="12" font-weight="700">Servidores Windows</text>
    <text x="25" y="86" fill="#94a3b8" font-size="10.5">• CIFS SMB 3.1.1 (ro, soft)</text>
    <text x="25" y="103" fill="#94a3b8" font-size="10.5">• Soporte AD DOMINIO\user</text>
    <text x="25" y="120" fill="#38bdf8" font-size="10">Credenciales 0600 root:root</text>

    <!-- Origen Linux -->
    <rect x="15" y="155" width="220" height="95" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="25" y="178" fill="#f8fafc" font-size="12" font-weight="700">Servidores Linux</text>
    <text x="25" y="196" fill="#94a3b8" font-size="10.5">• SSH cifrado + rsync -aAXH</text>
    <text x="25" y="213" fill="#94a3b8" font-size="10.5">• known_hosts_backup (TOFU)</text>
    <text x="25" y="230" fill="#10b981" font-size="10">Preserva ACLs y UIDs exactos</text>

    <!-- Origen Local -->
    <rect x="15" y="265" width="220" height="95" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="25" y="288" fill="#f8fafc" font-size="12" font-weight="700">Carpetas Locales</text>
    <text x="25" y="306" fill="#94a3b8" font-size="10.5">• Rutas internas del servidor</text>
    <text x="25" y="323" fill="#94a3b8" font-size="10.5">• rsync directo sin red</text>
    <text x="25" y="340" fill="#f59e0b" font-size="10">Sin sobrecarga de sockets</text>
  </g>

  <!-- Flecha 1 -> 2 -->
  <line x1="285" y1="300" x2="320" y2="300" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Paso 2: Pre-validaciones y Bloqueo -->
  <g transform="translate(325, 105)">
    <rect width="280" height="395" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="280" height="4" rx="2" fill="#f59e0b"/>
    <text x="18" y="28" fill="#fbbf24" font-size="11" font-weight="700" letter-spacing="1">2. CONTROL Y STAGING ATÓMICO</text>

    <!-- Cerrojo flock -->
    <rect x="15" y="45" width="250" height="80" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="25" y="68" fill="#f8fafc" font-size="12" font-weight="700">Exclusión Mutua (flock)</text>
    <text x="25" y="86" fill="#94a3b8" font-size="10.5">/var/lock/backup_&lt;tarea&gt;.lock</text>
    <text x="25" y="104" fill="#fbbf24" font-size="10">Evita solapamiento de procesos</text>

    <!-- Chequeo Espacio -->
    <rect x="15" y="140" width="250" height="85" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="25" y="163" fill="#f8fafc" font-size="12" font-weight="700">Monitoreo Preventivo (df -Pk)</text>
    <text x="25" y="181" fill="#94a3b8" font-size="10.5">• Alerta al superar el 85% de uso</text>
    <text x="25" y="198" fill="#ef4444" font-size="10.5">• Aborta seguro si &lt; 2 GB o &gt; 95%</text>

    <!-- Staging Temporal -->
    <rect x="15" y="240" width="250" height="135" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="25" y="263" fill="#f8fafc" font-size="12" font-weight="700">Staging .inprogress_*</text>
    <text x="25" y="282" fill="#94a3b8" font-size="10.5">Directorio temporal aislado:</text>
    <text x="25" y="299" fill="#38bdf8" font-size="9.5">/srv/nas/BACKUPS/.../.inprogress_xxx</text>
    <text x="25" y="325" fill="#f8fafc" font-size="10.5">trap cleanup EXIT TERM INT</text>
    <text x="25" y="345" fill="#10b981" font-size="10">Ante fallo/corte: purga inmediata</text>
  </g>

  <!-- Flecha 2 -> 3 -->
  <line x1="610" y1="300" x2="645" y2="300" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Paso 3: Deduplicación y Almacén Final -->
  <g transform="translate(650, 105)">
    <rect width="280" height="395" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="280" height="4" rx="2" fill="url(#accent-green)"/>
    <text x="18" y="28" fill="#34d399" font-size="11" font-weight="700" letter-spacing="1">3. SNAPSHOT Y DEDUPLICACIÓN</text>

    <!-- rsync link-dest -->
    <rect x="15" y="45" width="250" height="110" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="25" y="68" fill="#f8fafc" font-size="12" font-weight="700">rsync --link-dest</text>
    <text x="25" y="87" fill="#94a3b8" font-size="10.5">Compara con último snapshot:</text>
    <text x="25" y="104" fill="#34d399" font-size="10.5">• Archivo idéntico: mismo inodo (0 B)</text>
    <text x="25" y="121" fill="#fbbf24" font-size="10.5">• Archivo modificado: nuevo bloque</text>
    <text x="25" y="140" fill="#10b981" font-size="10">Ahorro superior al 85% de espacio</text>

    <!-- Promoción Atómica -->
    <rect x="15" y="170" width="250" height="95" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="25" y="193" fill="#f8fafc" font-size="12" font-weight="700">Promoción Atómica (mv)</text>
    <text x="25" y="212" fill="#94a3b8" font-size="10.5">Solo tras código de salida exitoso 0:</text>
    <text x="25" y="230" fill="#f8fafc" font-size="10">.inprogress_*  ➔  snapshot_YYYY-MM-DD</text>
    <text x="25" y="250" fill="#10b981" font-size="10">Histórico siempre 100% íntegro</text>

    <!-- Retención y Purga -->
    <rect x="15" y="280" width="250" height="95" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="25" y="303" fill="#f8fafc" font-size="12" font-weight="700">Política de Retención</text>
    <text x="25" y="322" fill="#94a3b8" font-size="10.5">Conserva N snapshots recientes.</text>
    <text x="25" y="339" fill="#94a3b8" font-size="10.5">Borra cronológico head -n -RETENTION.</text>
    <text x="25" y="358" fill="#38bdf8" font-size="10">Inodos compartidos nunca se pierden</text>
  </g>
</svg>
