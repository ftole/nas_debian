<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%" style="background:#0b1120; font-family:system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1 L 8 5 L 1 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1 L 8 5 L 1 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1 L 8 5 L 1 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Encabezado -->
  <rect x="24" y="18" width="912" height="54" rx="10" fill="#111827" stroke="#263244" stroke-width="1"/>
  <g transform="translate(42, 33)" fill="none" stroke="#10b981" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="23 4 23 10 17 10"/>
    <polyline points="1 20 1 14 7 14"/>
    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
  </g>
  <text x="78" y="42" fill="#f8fafc" font-size="16" font-weight="700">Pipeline de Respaldos, Staging Atómico y Deduplicación</text>
  <text x="78" y="59" fill="#94a3b8" font-size="11.5">Exclusión mutua (flock) • Control híbrido de capacidad • Promoción atómica sin copias parciales</text>

  <!-- Etapa 1: Origen -->
  <g transform="translate(24, 90)">
    <rect width="208" height="328" rx="10" fill="#111827" stroke="#263244" stroke-width="1"/>
    <text x="16" y="28" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="0.8">1. ORIGEN Y ACCESO</text>

    <rect x="14" y="44" width="180" height="78" rx="7" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="24" y="65" fill="#f8fafc" font-size="11.5" font-weight="600">Windows (CIFS / SMB)</text>
    <text x="24" y="83" fill="#94a3b8" font-size="10">Montaje temporal ro</text>
    <text x="24" y="99" fill="#94a3b8" font-size="10">SMB 3.1.1 • AD soportado</text>

    <rect x="14" y="134" width="180" height="78" rx="7" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="24" y="155" fill="#f8fafc" font-size="11.5" font-weight="600">Linux Remoto (SSH)</text>
    <text x="24" y="173" fill="#94a3b8" font-size="10">Llave Ed25519 / sshpass</text>
    <text x="24" y="189" fill="#94a3b8" font-size="10">Política TOFU verificada</text>

    <rect x="14" y="224" width="180" height="86" rx="7" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="24" y="245" fill="#f8fafc" font-size="11.5" font-weight="600">Local y Secretos</text>
    <text x="24" y="263" fill="#94a3b8" font-size="10">Rutas locales en servidor</text>
    <text x="24" y="279" fill="#38bdf8" font-size="10">Claves vía stdin (0600)</text>
    <text x="24" y="295" fill="#94a3b8" font-size="10">Nunca expuestas en ps</text>
  </g>

  <line x1="232" y1="254" x2="255" y2="254" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Etapa 2: Bloqueo y Espacio -->
  <g transform="translate(258, 90)">
    <rect width="208" height="328" rx="10" fill="#111827" stroke="#263244" stroke-width="1"/>
    <text x="16" y="28" fill="#fbbf24" font-size="11" font-weight="700" letter-spacing="0.8">2. CONTROL PREVIO</text>

    <rect x="14" y="44" width="180" height="120" rx="7" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="24" y="65" fill="#f8fafc" font-size="11.5" font-weight="600">Exclusión y Cola</text>
    <text x="24" y="85" fill="#94a3b8" font-size="10">• Cerrojo flock por tarea</text>
    <text x="24" y="103" fill="#94a3b8" font-size="10">• Cola por disco (nas-pool)</text>
    <text x="24" y="121" fill="#fbbf24" font-size="10">1 turno en HDD / hasta 2 SSD</text>
    <text x="24" y="142" fill="#94a3b8" font-size="10">Depura .inprogress_* previo</text>

    <rect x="14" y="176" width="180" height="134" rx="7" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="24" y="197" fill="#f8fafc" font-size="11.5" font-weight="600">Umbral Híbrido Espacio</text>
    <text x="24" y="218" fill="#94a3b8" font-size="10">• Reserva mínima: 2% libre</text>
    <text x="24" y="236" fill="#94a3b8" font-size="10">  (acotada entre 2 y 32 GiB)</text>
    <text x="24" y="256" fill="#fbbf24" font-size="10">• Corte seguro: 95%–98%</text>
    <text x="24" y="276" fill="#94a3b8" font-size="10">• Watchdog cada 15s en vivo</text>
    <text x="24" y="294" fill="#94a3b8" font-size="10">Evita llenar Btrfs al 100%</text>
  </g>

  <line x1="466" y1="254" x2="489" y2="254" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <!-- Etapa 3: Staging -->
  <g transform="translate(492, 90)">
    <rect width="208" height="328" rx="10" fill="#111827" stroke="#263244" stroke-width="1"/>
    <text x="16" y="28" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="0.8">3. COPIA EN STAGING</text>

    <rect x="14" y="44" width="180" height="134" rx="7" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="24" y="65" fill="#f8fafc" font-size="11.5" font-weight="600">Área Temporal Aislada</text>
    <text x="24" y="85" fill="#38bdf8" font-size="10">.inprogress_YYYY-MM-DD</text>
    <text x="24" y="105" fill="#94a3b8" font-size="10">rsync --link-dest preserva</text>
    <text x="24" y="122" fill="#94a3b8" font-size="10">ACLs, xattrs y UID/GID</text>
    <text x="24" y="142" fill="#10b981" font-size="10">Sin cambios = hardlink (0 B)</text>
    <text x="24" y="160" fill="#94a3b8" font-size="10">Progreso y ETA en tiempo real</text>

    <rect x="14" y="190" width="180" height="120" rx="7" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="24" y="211" fill="#f8fafc" font-size="11.5" font-weight="600">Resiliencia ante Cortes</text>
    <text x="24" y="232" fill="#94a3b8" font-size="10">trap cleanup EXIT TERM INT</text>
    <text x="24" y="252" fill="#10b981" font-size="10">Si hay apagón o cancelación:</text>
    <text x="24" y="269" fill="#94a3b8" font-size="10">• Desmonta origen remoto</text>
    <text x="24" y="286" fill="#94a3b8" font-size="10">• Elimina copia incompleta</text>
  </g>

  <line x1="700" y1="254" x2="723" y2="254" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Etapa 4: Promoción y Retención -->
  <g transform="translate(726, 90)">
    <rect width="210" height="328" rx="10" fill="#111827" stroke="#263244" stroke-width="1"/>
    <text x="16" y="28" fill="#10b981" font-size="11" font-weight="700" letter-spacing="0.8">4. SNAPSHOT FINAL</text>

    <rect x="14" y="44" width="182" height="124" rx="7" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="24" y="65" fill="#f8fafc" font-size="11.5" font-weight="600">Promoción Atómica</text>
    <text x="24" y="85" fill="#94a3b8" font-size="10">Solo tras salida exitosa (0):</text>
    <text x="24" y="104" fill="#10b981" font-size="10">mv .inprogress ➔ snapshot_*</text>
    <text x="24" y="124" fill="#94a3b8" font-size="10">Bloqueo chattr +i al contenedor</text>
    <text x="24" y="142" fill="#94a3b8" font-size="10">(sin mutar inodos internos)</text>

    <rect x="14" y="180" width="182" height="130" rx="7" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="24" y="201" fill="#f8fafc" font-size="11.5" font-weight="600">Retención &amp; Permanentes</text>
    <text x="24" y="221" fill="#94a3b8" font-size="10">• Conserva últimos N snapshots</text>
    <text x="24" y="240" fill="#94a3b8" font-size="10">• Golden Snapshots (FULL_*):</text>
    <text x="24" y="257" fill="#38bdf8" font-size="10">  cp -al / --reflink=always</text>
    <text x="24" y="277" fill="#94a3b8" font-size="10">• Migración dedup idempotente</text>
    <text x="24" y="294" fill="#94a3b8" font-size="10">  con límites RAM/IO cgroups</text>
  </g>
</svg>
