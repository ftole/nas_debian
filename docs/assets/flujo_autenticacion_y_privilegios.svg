<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%" style="background:#0f172a; font-family:system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Header -->
  <rect x="30" y="20" width="900" height="60" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="65" cy="50" r="14" fill="#8b5cf6"/>
  <path d="M60 50 A5 5 0 1 1 70 50 L70 54 L60 54 Z" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round"/>
  <text x="92" y="45" fill="#f8fafc" font-size="18" font-weight="700">Flujo de Autenticación Web y Frontera de Privilegios</text>
  <text x="92" y="64" fill="#94a3b8" font-size="12">De la petición HTTPS hasta la ejecución acotada sin shell ni exposición de credenciales</text>

  <!-- Columna 1: Acceso y Auth -->
  <g transform="translate(30, 98)">
    <rect width="275" height="432" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="275" height="4" rx="2" fill="#3b82f6"/>
    <text x="16" y="28" fill="#60a5fa" font-size="11" font-weight="700" letter-spacing="1">1. ACCESO Y AUTENTICACIÓN</text>

    <rect x="14" y="42" width="247" height="72" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="24" y="62" fill="#f8fafc" font-size="12" font-weight="700">Navegador -&gt; Nginx TLS</text>
    <text x="24" y="79" fill="#94a3b8" font-size="10">• HTTPS en :443 -&gt; proxy 127.0.0.1:8080</text>
    <text x="24" y="96" fill="#38bdf8" font-size="10">• Cabeceras CSP, XFO, nosniff</text>

    <rect x="14" y="128" width="247" height="82" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="24" y="148" fill="#f8fafc" font-size="12" font-weight="700">Rate Limit &amp; Verificación</text>
    <text x="24" y="165" fill="#94a3b8" font-size="10">• api_rate_limits (5 fallos/60s -&gt; 429)</text>
    <text x="24" y="182" fill="#94a3b8" font-size="10">• PBKDF2-HMAC-SHA512 (210k iter)</text>
    <text x="24" y="198" fill="#10b981" font-size="9.5">• Dummy hash anti-timing + upgrade SHA256</text>

    <rect x="14" y="224" width="247" height="92" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="24" y="244" fill="#f8fafc" font-size="12" font-weight="700">Sesión, Cookie y CSRF</text>
    <text x="24" y="261" fill="#94a3b8" font-size="10">• Sesión en SQLite WAL (web_sessions)</text>
    <text x="24" y="278" fill="#94a3b8" font-size="10">• Cookie HttpOnly; SameSite=Strict; Secure</text>
    <text x="24" y="295" fill="#38bdf8" font-size="10">• Token CSRF HMAC-SHA256 por sesión</text>

    <rect x="14" y="330" width="247" height="86" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="24" y="350" fill="#f8fafc" font-size="12" font-weight="700">Extractors de Autorización</text>
    <text x="24" y="367" fill="#94a3b8" font-size="10">• AuthenticatedUser (lectura/sesión)</text>
    <text x="24" y="384" fill="#94a3b8" font-size="10">• AdminUser (operaciones admin)</text>
    <text x="24" y="401" fill="#fbbf24" font-size="10">• SuperAdminUser (/etc/nas/superadmin)</text>
  </g>

  <line x1="308" y1="310" x2="338" y2="310" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Columna 2: Backend sin privilegios y frontera sudoers -->
  <g transform="translate(343, 98)">
    <rect width="275" height="432" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="275" height="4" rx="2" fill="#8b5cf6"/>
    <text x="16" y="28" fill="#a78bfa" font-size="11" font-weight="700" letter-spacing="1">2. SANDBOX Y FRONTERA SUDO</text>

    <rect x="14" y="42" width="247" height="106" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="24" y="62" fill="#f8fafc" font-size="12" font-weight="700">Proceso nas-web (usuario sin login)</text>
    <text x="24" y="80" fill="#94a3b8" font-size="10">• Axum ejecuta sin root (usuario nas-web)</text>
    <text x="24" y="97" fill="#94a3b8" font-size="10">• ProtectSystem=yes / ProtectKernelTunables</text>
    <text x="24" y="114" fill="#94a3b8" font-size="10">• SystemCallFilter=@system-service</text>
    <text x="24" y="131" fill="#a78bfa" font-size="9.5">• NoNewPrivileges=no + Capabilities acotadas</text>

    <rect x="14" y="162" width="247" height="108" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="24" y="182" fill="#f8fafc" font-size="12" font-weight="700">nas-exec (Ejecución Tipada)</text>
    <text x="24" y="200" fill="#94a3b8" font-size="10">• CommandSpec con arreglo argv explícito</text>
    <text x="24" y="217" fill="#94a3b8" font-size="10">• Sin shell (/bin/sh -c prohibido)</text>
    <text x="24" y="234" fill="#94a3b8" font-size="10">• env_clear() + PATH fijo + timeout</text>
    <text x="24" y="251" fill="#10b981" font-size="9.5">• Datos sensibles vía stdin (install-spec)</text>

    <rect x="14" y="284" width="247" height="132" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="24" y="304" fill="#fbbf24" font-size="12" font-weight="700">Lista Blanca sudoers (sudo -n)</text>
    <text x="24" y="322" fill="#94a3b8" font-size="10">• /etc/sudoers.d/nas-web-rust</text>
    <text x="24" y="339" fill="#94a3b8" font-size="10">• Validado con visudo -c al instalar</text>
    <text x="24" y="356" fill="#94a3b8" font-size="10">• Permite solo binarios y subcomandos</text>
    <text x="24" y="372" fill="#94a3b8" font-size="10">  específicos (systemctl, btrfs, helpers)</text>
    <text x="24" y="395" fill="#fbbf24" font-size="9.5">• Rechaza cualquier parámetro fuera de lista</text>
  </g>

  <line x1="621" y1="310" x2="651" y2="310" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <!-- Columna 3: 7 Helpers Root y Auditoría -->
  <g transform="translate(656, 98)">
    <rect width="274" height="432" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="274" height="4" rx="2" fill="#10b981"/>
    <text x="16" y="28" fill="#34d399" font-size="11" font-weight="700" letter-spacing="1">3. HELPERS ROOT Y AUDITORÍA</text>

    <rect x="14" y="42" width="246" height="234" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="24" y="62" fill="#f8fafc" font-size="12" font-weight="700">7 Helpers en /usr/local/sbin/</text>
    <text x="24" y="82" fill="#34d399" font-size="10">1. nas-samba-apply</text>
    <text x="145" y="82" fill="#94a3b8" font-size="9.5">(testparm + smb.conf)</text>
    <text x="24" y="102" fill="#34d399" font-size="10">2. nas-share-dir</text>
    <text x="145" y="102" fill="#94a3b8" font-size="9.5">(mkdir/rm /srv/nas)</text>
    <text x="24" y="122" fill="#34d399" font-size="10">3. nas-share-acl</text>
    <text x="145" y="122" fill="#94a3b8" font-size="9.5">(2770 + setfacl)</text>
    <text x="24" y="142" fill="#34d399" font-size="10">4. nas-accounts</text>
    <text x="145" y="142" fill="#94a3b8" font-size="9.5">(usuarios/grupos OS)</text>
    <text x="24" y="162" fill="#34d399" font-size="10">5. nas-backup-manage</text>
    <text x="145" y="162" fill="#94a3b8" font-size="9.5">(cron + cred stdin)</text>
    <text x="24" y="182" fill="#34d399" font-size="10">6. nas-terminal</text>
    <text x="145" y="182" fill="#94a3b8" font-size="9.5">(sesiones PTY tmux)</text>
    <text x="24" y="202" fill="#34d399" font-size="10">7. nas-storage-apply</text>
    <text x="145" y="202" fill="#94a3b8" font-size="9.5">(parted/LVM/Btrfs)</text>
    <text x="24" y="230" fill="#94a3b8" font-size="9.5">• Invocan internamente `nas helper ...`</text>
    <text x="24" y="246" fill="#94a3b8" font-size="9.5">• Validan is_os_disk() y rutas /srv/nas</text>
    <text x="24" y="262" fill="#38bdf8" font-size="9.5">• Sin paso de secretos por argv</text>

    <rect x="14" y="290" width="246" height="126" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="24" y="310" fill="#f8fafc" font-size="12" font-weight="700">Registro Doble de Auditoría</text>
    <text x="24" y="328" fill="#94a3b8" font-size="10">• SQLite web_audit (usuario + origin_ip)</text>
    <text x="24" y="345" fill="#94a3b8" font-size="10">• nas-audit: bitácora append-only con</text>
    <text x="24" y="361" fill="#94a3b8" font-size="10">  encadenamiento criptográfico SHA-256</text>
    <text x="24" y="378" fill="#a78bfa" font-size="10">• auditd kernel (sudoers, smb.conf, cred,</text>
    <text x="24" y="394" fill="#a78bfa" font-size="10">  nas-terminal)</text>
  </g>
</svg>
