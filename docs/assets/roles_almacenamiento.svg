<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" style="background:#0f172a; font-family:system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="role-nas" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="role-bkp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="role-mix" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Header -->
  <rect x="30" y="20" width="900" height="60" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="65" cy="50" r="14" fill="#f59e0b"/>
  <path d="M59 50 L65 44 L71 50 M65 44 L65 56" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="92" y="45" fill="#f8fafc" font-size="18" font-weight="700">Matriz de 3 Roles y Selección de Almacenamiento</text>
  <text x="92" y="64" fill="#94a3b8" font-size="12">Comportamiento de /srv/nas, filesystem por defecto (ext4 / Btrfs) y protección del disco del sistema</text>

  <!-- Barra de Protección y Reutilización -->
  <g transform="translate(30, 94)">
    <rect width="900" height="48" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4,4"/>
    <text x="20" y="21" fill="#38bdf8" font-size="11" font-weight="700">PROTECCIÓN Y FLEXIBILIDAD EN EL DESPLIEGUE (nas deploy apply):</text>
    <text x="20" y="38" fill="#cbd5e1" font-size="10.5">• Guardián is_os_disk() impide formatear el disco raíz • --keep-data monta /srv/nas sin borrar • --ext4 / --btrfs sobrescriben el perfil por defecto</text>
  </g>

  <!-- Columna 1: ARCHIVOS -->
  <g transform="translate(30, 156)">
    <rect width="286" height="358" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="286" height="5" rx="2" fill="url(#role-nas)"/>
    <text x="18" y="30" fill="#60a5fa" font-size="14" font-weight="700">1. ARCHIVOS</text>
    <text x="18" y="47" fill="#94a3b8" font-size="10.5">NAS Departamental • NetBIOS SRV-NAS</text>

    <rect x="14" y="60" width="258" height="84" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="24" y="80" fill="#38bdf8" font-size="11" font-weight="700">Filesystem por defecto: ext4</text>
    <text x="24" y="97" fill="#94a3b8" font-size="10">• HDD: rw,noatime,commit=2 (anti-apagón)</text>
    <text x="24" y="113" fill="#94a3b8" font-size="10">• SSD: rw,noatime,commit=5 + fstrim</text>
    <text x="24" y="129" fill="#10b981" font-size="10">• tune2fs -m 1 (recupera 4% útil)</text>

    <rect x="14" y="156" width="258" height="90" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="24" y="176" fill="#f8fafc" font-size="11" font-weight="700">Recursos y Acceso SMB</text>
    <text x="24" y="193" fill="#94a3b8" font-size="10">• Carpetas visibles en red Windows</text>
    <text x="24" y="209" fill="#94a3b8" font-size="10">• VFS: acl_xattr, streams_xattr, recycle</text>
    <text x="24" y="225" fill="#94a3b8" font-size="10">• Protocolo SMB2_10..SMB3_11</text>

    <rect x="14" y="258" width="258" height="84" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="24" y="278" fill="#f8fafc" font-size="11" font-weight="700">Ajustes de Bloque y Cron</text>
    <text x="24" y="295" fill="#94a3b8" font-size="10">• udev readahead: 4096 KB HDD / 1024 SSD</text>
    <text x="24" y="311" fill="#94a3b8" font-size="10">• Sin btrfs scrub programado</text>
    <text x="24" y="327" fill="#38bdf8" font-size="10">• Purga diaria de .recycle (&gt;30 días)</text>
  </g>

  <!-- Columna 2: BACKUP -->
  <g transform="translate(337, 156)">
    <rect width="286" height="358" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="286" height="5" rx="2" fill="url(#role-bkp)"/>
    <text x="18" y="30" fill="#34d399" font-size="14" font-weight="700">2. BACKUP</text>
    <text x="18" y="47" fill="#94a3b8" font-size="10.5">Central de Respaldos • NetBIOS SRV-BKP</text>

    <rect x="14" y="60" width="258" height="84" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="24" y="80" fill="#34d399" font-size="11" font-weight="700">Filesystem por defecto: Btrfs</text>
    <text x="24" y="97" fill="#94a3b8" font-size="10">• compress=zstd:3,space_cache=v2</text>
    <text x="24" y="113" fill="#94a3b8" font-size="10">• HDD: autodefrag | SSD: ssd,discard=async</text>
    <text x="24" y="129" fill="#10b981" font-size="10">• Ahorro de espacio ~20% a 40%</text>

    <rect x="14" y="156" width="258" height="90" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="24" y="176" fill="#f8fafc" font-size="11" font-weight="700">Recursos Administrativos ($)</text>
    <text x="24" y="193" fill="#94a3b8" font-size="10">• /srv/nas/BACKUPS -&gt; BACKUPS$</text>
    <text x="24" y="209" fill="#94a3b8" font-size="10">• /srv/nas/LOGS_BACKUP (2770 grp_samba)</text>
    <text x="24" y="225" fill="#94a3b8" font-size="10">• Acceso restringido grp_backups/admins</text>

    <rect x="14" y="258" width="258" height="84" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="24" y="278" fill="#f8fafc" font-size="11" font-weight="700">Integridad y Snapshots</text>
    <text x="24" y="295" fill="#94a3b8" font-size="10">• btrfs scrub día 1 de mes a las 02:00</text>
    <text x="24" y="311" fill="#94a3b8" font-size="10">• rsync --link-dest (deduplicación &gt;85%)</text>
    <text x="24" y="327" fill="#34d399" font-size="10">• Checksums nativos anti Bit Rot</text>
  </g>

  <!-- Columna 3: ARCHIVOS_BACKUP -->
  <g transform="translate(644, 156)">
    <rect width="286" height="358" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="286" height="5" rx="2" fill="url(#role-mix)"/>
    <text x="18" y="30" fill="#fbbf24" font-size="14" font-weight="700">3. ARCHIVOS_BACKUP</text>
    <text x="18" y="47" fill="#94a3b8" font-size="10.5">Rol Mixto Unificado (NAS + Central)</text>

    <rect x="14" y="60" width="258" height="84" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="24" y="80" fill="#fbbf24" font-size="11" font-weight="700">Filesystem por defecto: Btrfs</text>
    <text x="24" y="97" fill="#94a3b8" font-size="10">• compress=zstd:3,space_cache=v2</text>
    <text x="24" y="113" fill="#94a3b8" font-size="10">• Admite override --ext4 si se requiere</text>
    <text x="24" y="129" fill="#f59e0b" font-size="10">• Ideal para sedes con nodo único</text>

    <rect x="14" y="156" width="258" height="90" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="24" y="176" fill="#f8fafc" font-size="11" font-weight="700">Recursos Combinados</text>
    <text x="24" y="193" fill="#94a3b8" font-size="10">• Carpetas departamentales visibles</text>
    <text x="24" y="209" fill="#94a3b8" font-size="10">• + Recurso oculto BACKUPS$</text>
    <text x="24" y="225" fill="#94a3b8" font-size="10">• + Gestión LVM / subvolúmenes Btrfs</text>

    <rect x="14" y="258" width="258" height="84" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="24" y="278" fill="#f8fafc" font-size="11" font-weight="700">Mantenimiento Activo</text>
    <text x="24" y="295" fill="#94a3b8" font-size="10">• btrfs scrub mensual programado</text>
    <text x="24" y="311" fill="#94a3b8" font-size="10">• Purga diaria de papelera .recycle</text>
    <text x="24" y="327" fill="#fbbf24" font-size="10">• Todas las vistas web habilitadas</text>
  </g>
</svg>
