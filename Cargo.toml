[workspace]
resolver = "2"
members = [
    "crates/nas-core",
    "crates/nas-exec",
    "crates/nas-inventory",
    "crates/nas-ssh",
    "crates/nas-engine",
    "crates/nas-audit",
    "crates/nas-cli",
    "crates/nas-web",
    "crates/nas-dev",
    "crates/nasctl",
    "crates/nas-tui",
]

[workspace.package]
version = "0.1.8"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/ftole/nas_debian"
authors = ["EAD-COL"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
regex = "1"
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["set-header"] }
http-body-util = "0.1"
hmac = "0.12"
zip = { version = "2", default-features = false, features = ["deflate"] }
ratatui = "0.29"
crossterm = "0.28"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-core = "0.3"

nas-core = { path = "crates/nas-core" }
nas-exec = { path = "crates/nas-exec" }
nas-inventory = { path = "crates/nas-inventory" }
nas-ssh = { path = "crates/nas-ssh" }
nas-web = { path = "crates/nas-web" }
nas-tui = { path = "crates/nas-tui" }
nas-engine = { path = "crates/nas-engine" }
nas-audit = { path = "crates/nas-audit" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
