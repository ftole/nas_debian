[workspace]
resolver = "2"
members = [
    "crates/nas-core",
    "crates/nas-exec",
    "crates/nas-engine",
    "crates/nas-audit",
    "crates/nas-cli",
    "crates/nas-dev",
    "crates/nasctl",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/ftole/nas_debian"
authors = ["EAD-COL"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
regex = "1"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

nas-core = { path = "crates/nas-core" }
nas-exec = { path = "crates/nas-exec" }
nas-engine = { path = "crates/nas-engine" }
nas-audit = { path = "crates/nas-audit" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
